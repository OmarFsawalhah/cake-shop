services:
  db:
    image: postgres:16-alpine
    container_name: cakeshop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cakeshop
      POSTGRES_PASSWORD: cakeshop
      POSTGRES_DB: cakeshop
    ports:
      - "5432:5432"
    volumes:
      - cakeshop_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cakeshop -d cakeshop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cakeshop_db_data:
