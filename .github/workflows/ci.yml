name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cakeshop
          POSTGRES_PASSWORD: cakeshop
          POSTGRES_DB: cakeshop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cakeshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cakeshop:cakeshop@localhost:5432/cakeshop?schema=public
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
